<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - Hanna's Connect</title>
  <style>
    body { background: #f8fafc; color: #B22222; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .container { text-align: center; }
    h1 { font-size: 2rem; margin-bottom: 0.5em; }
    p { color: #555; margin-bottom: 2em; }
    .icon { font-size: 3rem; margin-bottom: 1em; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔌</div>
    <h1>You're Offline</h1>
    <p>It looks like you lost your internet connection.<br />Please check your network and try again.</p>
    <p><strong>Hanna's Connect</strong></p>
  </div>
  <script>
    // Store the last real page before going offline
    if (window.location.pathname !== '/offline.html') {
      localStorage.setItem('lastOnlinePath', window.location.pathname + window.location.search + window.location.hash);
    }

    // If we are on offline.html, listen for coming back online
    if (window.location.pathname === '/offline.html') {
      window.addEventListener('online', function () {
        const lastPath = localStorage.getItem('lastOnlinePath') || '/';
        window.location.href = lastPath;
      });
    }
  </script>
</body>
</html>
