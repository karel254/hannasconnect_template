<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - Hanna's Connect</title>
  <style>
    body { background: #fff8f6; color: #B22222; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .container { text-align: center; }
    h1 { font-size: 2rem; margin-bottom: 0.5em; color: #B22222; font-weight: 700; }
    p { color: #B22222; margin-bottom: 1.2em; font-size: 1.1rem; }
    .icon { margin-bottom: 1.5em; }
    .slogan { font-weight: 500; color: #B22222; font-size: 1.1rem; margin-bottom: 0.5em; font-style: italic; }
    .subtle { color: #555; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#B22222" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21s-6.5-5.2-9-8.5C-1.5 7.5 3.5 2.5 8 6c1.7 1.4 2.5 2.5 4 4.5C13.5 8.5 14.3 7.4 16 6c4.5-3.5 9.5 1.5 5 6.5-2.5 3.3-9 8.5-9 8.5z" fill="#fff" stroke="#B22222"/>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>Hanna's Connect is best enjoyed online.<br />Please check your internet connection.<br /><span class="subtle">Some features may be unavailable.</span></p>
    <div class="slogan">Find Your Perfect Match, Anytime, Anywhere.</div>
  </div>
  <script>
    // Store the last real page before going offline
    if (window.location.pathname !== '/offline.html') {
      localStorage.setItem('lastOnlinePath', window.location.pathname + window.location.search + window.location.hash);
    }

    // If we are on offline.html, listen for coming back online
    if (window.location.pathname === '/offline.html') {
      function forceCleanReload() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
            setTimeout(() => {
              const lastPath = localStorage.getItem('lastOnlinePath') || '/';
              window.location.href = lastPath;
            }, 500);
          });
        } else {
          const lastPath = localStorage.getItem('lastOnlinePath') || '/';
          window.location.href = lastPath;
        }
      }
      function tryRedirect() {
        if (navigator.onLine && window.location.pathname === '/offline.html') {
          forceCleanReload();
        }
      }
      window.addEventListener('online', tryRedirect);
      setTimeout(forceCleanReload, 1); // Fastest possible automatic reload
      setInterval(tryRedirect, 1000); // Poll every second
    }
  </script>
</body>
</html>
